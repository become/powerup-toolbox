<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>PowerUp Toolbox - 16s Ultra Fast-Paced Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 1920px;
      height: 1080px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #stageCanvas {
      width: 1920px;
      height: 1080px;
      display: block;
      background: #060913;
    }
  </style>
</head>
<body>
  <canvas id="stageCanvas" width="1920" height="1080"></canvas>

  <script>
    const canvas = document.getElementById('stageCanvas');
    const ctx = canvas.getContext('2d');
    const W = 1920;
    const H = 1080;
    const TOTAL_FRAMES = 400; // 16 seconds at 25 fps
    const FPS = 25;

    // Assets
    const assets = {};
    const assetSources = {
      appIcon: 'assets/app_icon.png',
      heroBanner: 'assets/hero_banner.jpg',
      browseGrid: 'assets/image_browse_grid.jpg',
      browseSingle: 'assets/image_browse_single.jpg',
      photo01: 'assets/samples/photo_01_god.png',
      photo02: 'assets/samples/photo_02_portrait.jpg',
      photo03: 'assets/samples/photo_03_street.jpg',
      god01: 'assets/samples/god01.png',
      god02: 'assets/samples/god02.png',
      god03: 'assets/samples/god03.png',
      god04: 'assets/samples/god04.png',
      god05: 'assets/samples/god05.png',
      jsonImg: 'assets/reorganized_json_1366.png',
      mdImg: 'assets/reorganized_md_1366.png',
      csvImg: 'assets/reorganized_csv_1366.png'
    };

    let loadedCount = 0;
    const totalAssets = Object.keys(assetSources).length;
    window.assetsReady = false;

    for (let key in assetSources) {
      const img = new Image();
      img.src = assetSources[key];
      img.onload = () => {
        loadedCount++;
        assets[key] = img;
        if (loadedCount === totalAssets) {
          window.assetsReady = true;
          renderFrame(0);
        }
      };
      img.onerror = () => {
        loadedCount++;
        assets[key] = null;
        if (loadedCount === totalAssets) {
          window.assetsReady = true;
          renderFrame(0);
        }
      };
    }

    function easeOutBack(t) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }
    function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }

    function drawRoundedRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawCyberBackground(t) {
      ctx.fillStyle = '#060913';
      ctx.fillRect(0, 0, W, H);

      const p1 = Math.sin(t * 3.5) * 60;
      const g1 = ctx.createRadialGradient(W * 0.3 + p1, H * 0.25, 20, W * 0.3, H * 0.25, 800);
      g1.addColorStop(0, 'rgba(245, 158, 11, 0.25)');
      g1.addColorStop(0.5, 'rgba(236, 72, 153, 0.12)');
      g1.addColorStop(1, 'transparent');
      ctx.fillStyle = g1;
      ctx.fillRect(0, 0, W, H);

      const g2 = ctx.createRadialGradient(W * 0.75, H * 0.7, 20, W * 0.75, H * 0.7, 850);
      g2.addColorStop(0, 'rgba(59, 130, 246, 0.22)');
      g2.addColorStop(0.5, 'rgba(16, 185, 129, 0.08)');
      g2.addColorStop(1, 'transparent');
      ctx.fillStyle = g2;
      ctx.fillRect(0, 0, W, H);

      // Grid Lines
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 64) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }
      for (let y = 0; y < H; y += 64) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }
    }

    function drawWindowFrame(x, y, w, h, title, activeFileIdx, totalFiles) {
      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.75)';
      ctx.shadowBlur = 45;
      ctx.shadowOffsetY = 24;

      ctx.fillStyle = '#0f172a';
      drawRoundedRect(x, y, w, h, 14);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();

      // Top Header
      ctx.fillStyle = '#172033';
      ctx.beginPath();
      ctx.moveTo(x + 14, y);
      ctx.arcTo(x + w, y, x + w, y + 44, 14);
      ctx.lineTo(x + w, y + 44);
      ctx.lineTo(x, y + 44);
      ctx.arcTo(x, y, x + 14, y, 14);
      ctx.closePath();
      ctx.fill();

      // Traffic lights
      const dots = ['#ef4444', '#eab308', '#22c55e'];
      dots.forEach((c, i) => {
        ctx.fillStyle = c;
        ctx.beginPath();
        ctx.arc(x + 22 + i * 18, y + 22, 6, 0, Math.PI * 2);
        ctx.fill();
      });

      // Window Title
      ctx.fillStyle = '#cbd5e1';
      ctx.font = '600 15px "SF Mono", monospace';
      ctx.textAlign = 'left';
      ctx.fillText(title, x + 90, y + 27);

      // Counter Badge
      if (activeFileIdx !== undefined) {
        ctx.fillStyle = 'rgba(59, 130, 246, 0.25)';
        ctx.strokeStyle = '#3b82f6';
        ctx.lineWidth = 1.5;
        drawRoundedRect(x + w - 160, y + 10, 140, 26, 6);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#93c5fd';
        ctx.font = '700 13px "SF Mono", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`檔案 ${activeFileIdx} / ${totalFiles || 16}`, x + w - 90, y + 27);
      }
    }

    // ============================================
    // MAIN RENDER LOOP (16.0s Total, 400 Frames)
    // ============================================
    function renderFrame(frame) {
      const t = frame / FPS;
      drawCyberBackground(t);

      // ==========================================
      // ACT 1: KINETIC HOOK (0.0s - 2.5s)
      // "不要再慢慢等！" -> 3D 閃電衝擊波震裂
      // ==========================================
      if (t < 2.5) {
        if (t < 1.0) {
          ctx.save();
          ctx.textAlign = 'center';
          ctx.font = '900 68px -apple-system, sans-serif';
          ctx.fillStyle = '#ef4444';
          ctx.fillText('⚡ 還在一個個點開檔案？', W / 2, 490);
          ctx.font = '700 32px sans-serif';
          ctx.fillStyle = '#94a3b8';
          ctx.fillText('開多個軟體又卡又慢 • STOP WAITING', W / 2, 560);
          ctx.restore();
        } else {
          const bt = t - 1.0;
          const enter = easeOutBack(clamp(bt / 0.6, 0, 1));
          if (assets.appIcon) {
            const iconSize = 250 * enter;
            ctx.save();
            ctx.translate(W / 2, 330);

            const shock = clamp(bt / 1.0, 0, 1);
            ctx.strokeStyle = `rgba(245, 158, 11, ${1.0 - shock})`;
            ctx.lineWidth = 6 * (1.0 - shock);
            ctx.beginPath(); ctx.arc(0, 0, 120 + shock * 260, 0, Math.PI * 2); ctx.stroke();

            ctx.drawImage(assets.appIcon, -iconSize / 2, -iconSize / 2, iconSize, iconSize);
            ctx.restore();
          }

          ctx.save();
          ctx.textAlign = 'center';
          ctx.font = '900 76px -apple-system, sans-serif';
          const tGrad = ctx.createLinearGradient(W / 2 - 300, 0, W / 2 + 300, 0);
          tGrad.addColorStop(0, '#ffffff');
          tGrad.addColorStop(0.5, '#fde68a');
          tGrad.addColorStop(1, '#f472b6');
          ctx.fillStyle = tGrad;
          ctx.fillText('⚡ PowerUp Toolbox', W / 2, 520);

          ctx.font = '800 36px -apple-system, sans-serif';
          ctx.fillStyle = '#f8fafc';
          ctx.fillText('跨平台極速萬能檔案檢視器', W / 2, 585);

          ctx.font = '700 22px sans-serif';
          ctx.fillStyle = '#60a5fa';
          ctx.fillText('0 秒瞬開 • 方向鍵連續快切 • 免開多個軟體', W / 2, 640);
          ctx.restore();
        }
      }

      // ==========================================
      // ACT 2: RAPID-FIRE CONTINUOUS BROWSING (2.5s - 11.5s)
      // 16 Fast Cuts across multiple formats! 
      // Every 0.55s a new file flips!
      // ==========================================
      else if (t >= 2.5 && t < 11.5) {
        const st = t - 2.5; // 0 to 9.0s
        const winW = 1520;
        const winH = 750;
        const winX = (W - winW) / 2;
        const winY = 120;

        const cutIdx = Math.min(15, Math.floor(st / 0.55));
        const rapidFiles = [
          { name: 'TravelPhotos [3,482 張照片 · 快速縮圖網格]', type: 'image', asset: assets.browseGrid },
          { name: 'Tokyo_Sakura_001.jpg [6048×4032 24.4MP 4K 原寸]', type: 'image', asset: assets.browseSingle },
          { name: 'photo_02_portrait.jpg [Apple Vision 人臉辨識]', type: 'image', asset: assets.photo02, face: true },
          { name: 'data.json [JSON 樹狀即時修復]', type: 'json', asset: assets.jsonImg },
          { name: 'report.csv [百萬行即時圖表分析]', type: 'csv', asset: assets.csvImg },
          { name: 'README.md [Markdown 雙欄排版]', type: 'md', asset: assets.mdImg },
          { name: 'god02_guanyu.png [4K 高清繪卷]', type: 'image', asset: assets.god02 },
          { name: 'presentation_deck.pptx [簡報大綱檢視]', type: 'pptx' },
          { name: 'audio_ambient_sample.wav [音頻波形播放]', type: 'audio' },
          { name: 'god03_wealth.png [4K 潮玩設計]', type: 'image', asset: assets.god03 },
          { name: 'database_schema.sql [語法高亮秒讀]', type: 'json', asset: assets.jsonImg },
          { name: 'sales_forecast.csv [多維度透視分析]', type: 'csv', asset: assets.csvImg },
          { name: 'god04_guanyin.png [4K 國風壁畫]', type: 'image', asset: assets.god04 },
          { name: 'CHANGELOG_v2.md [版本更新日誌]', type: 'md', asset: assets.mdImg },
          { name: 'app_architecture.drawio [架構拓撲圖]', type: 'drawio' },
          { name: 'god05_pantheon.png [4K 眾神齊聚]', type: 'image', asset: assets.god05 }
        ];

        const cur = rapidFiles[cutIdx];

        // ==========================================
        // 1. Top Section: Kinetic Feature Headline Block
        // ==========================================
        let headTitle = '🖼️ 3,482 張海量圖片極速瀏覽 ＆ 4K 原生 AI 增強';
        let headSub = '大圖縮圖 0 秒瞬載 · 6048×4032 原寸適應 · 整合 Apple Vision 與 4x 超解析';

        if (t >= 4.5 && t < 6.5) {
          headTitle = '🌳 階層樹狀 JSON 檢視器 · 即時自動修復語法';
          headSub = '雙欄格狀對照 · 鍵值路徑自動複製 · 告別卡頓肥重 IDE';
        } else if (t >= 6.5 && t < 8.5) {
          headTitle = '📊 百萬行大數據表格 · 毫秒即時圖表分析';
          headSub = '自動統計加總、平均與達成率 · 柱狀圖一鍵透視分析';
        } else if (t >= 8.5 && t < 11.5) {
          headTitle = '📝 雙欄 Markdown 編輯 · 投影片大綱免開 Office';
          headSub = '即時渲染排版 · 支援流程圖、投影片與音頻波形播放';
        }

        ctx.save();
        ctx.textAlign = 'center';
        ctx.font = '900 36px -apple-system, sans-serif';
        const headGrad = ctx.createLinearGradient(W / 2 - 280, 0, W / 2 + 280, 0);
        headGrad.addColorStop(0, '#ffffff');
        headGrad.addColorStop(0.5, '#fde68a');
        headGrad.addColorStop(1, '#60a5fa');
        ctx.fillStyle = headGrad;
        ctx.fillText(headTitle, W / 2, 54);

        ctx.font = '600 16px -apple-system, sans-serif';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText(headSub, W / 2, 88);
        ctx.restore();

        // ==========================================
        // 2. Center Dedicated Operation Window Block
        // ==========================================
        drawWindowFrame(winX, winY, winW, winH, `PowerUp Toolbox · ${cur.name}`, cutIdx + 1, rapidFiles.length);

        // Draw Left Sidebar (File Tree)
        const sidebarW = 280;
        const sbX = winX + 1;
        const sbY = winY + 45;
        const sbW = sidebarW - 1;
        const sbH = winH - 46;

        ctx.fillStyle = '#0d1322';
        ctx.fillRect(sbX, sbY, sbW, sbH);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(sbX + sbW, sbY); ctx.lineTo(sbX + sbW, sbY + sbH); ctx.stroke();

        // Quick Category tabs row
        ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
        drawRoundedRect(sbX + 12, sbY + 12, sbW - 24, 28, 6);
        ctx.fill();
        ctx.fillStyle = '#94a3b8';
        ctx.font = '700 11px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('全部 14    圖 5    JSON 3    CSV 2', sbX + 20, sbY + 30);

        // Search bar
        ctx.fillStyle = '#172033';
        drawRoundedRect(sbX + 12, sbY + 46, sbW - 24, 26, 6);
        ctx.fill();
        ctx.fillStyle = '#64748b';
        ctx.font = '500 11px sans-serif';
        ctx.fillText('🔎 篩選檔名關鍵字...', sbX + 22, sbY + 63);

        // File List Items
        const sidebarFiles = [
          { name: 'TravelPhotos (3,482)', icon: '🗂️', badge: 'GRID' },
          { name: 'Tokyo_Sakura_001.jpg', icon: '🖼️', badge: 'IMG' },
          { name: 'photo_02_portrait.jpg', icon: '🖼️', badge: 'IMG' },
          { name: 'data.json', icon: '🧩', badge: 'JSON' },
          { name: 'report.csv', icon: '📊', badge: 'CSV' },
          { name: 'README.md', icon: '📝', badge: 'MD' },
          { name: 'god02_guanyu.png', icon: '🖼️', badge: 'IMG' },
          { name: 'presentation.pptx', icon: '📽️', badge: 'PPTX' },
          { name: 'ambient.wav', icon: '🎵', badge: 'WAV' },
          { name: 'god03_wealth.png', icon: '🖼️', badge: 'IMG' }
        ];

        sidebarFiles.forEach((sf, si) => {
          const itemY = sbY + 80 + si * 35;
          const isActive = (si === cutIdx % sidebarFiles.length);

          if (isActive) {
            ctx.fillStyle = 'rgba(59, 130, 246, 0.25)';
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 1.5;
            drawRoundedRect(sbX + 8, itemY, sbW - 16, 29, 6);
            ctx.fill(); ctx.stroke();

            ctx.fillStyle = '#60a5fa';
            ctx.fillRect(sbX + 8, itemY + 4, 3, 21);
          }

          ctx.fillStyle = isActive ? '#ffffff' : '#94a3b8';
          ctx.font = isActive ? '700 12px sans-serif' : '500 11.5px sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText(`${sf.icon}  ${sf.name}`, sbX + 18, itemY + 19);

          ctx.fillStyle = isActive ? '#60a5fa' : '#475569';
          ctx.font = '700 10px monospace';
          ctx.textAlign = 'right';
          ctx.fillText(sf.badge, sbX + sbW - 18, itemY + 19);
        });

        // Center Stage (with preserved aspect ratio!)
        const stageX = winX + sidebarW;
        const stageY = winY + 45;
        const stageW = winW - sidebarW;
        const stageH = winH - 46;

        ctx.save();
        ctx.beginPath();
        drawRoundedRect(stageX, stageY, stageW, stageH, 0);
        ctx.clip();

        ctx.fillStyle = '#080c16';
        ctx.fillRect(stageX, stageY, stageW, stageH);

        // Dot grid
        ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
        for (let gx = stageX + 24; gx < stageX + stageW; gx += 40) {
          for (let gy = stageY + 24; gy < stageY + stageH; gy += 40) {
            ctx.fillRect(gx, gy, 2, 2);
          }
        }

        if (cur.asset) {
          const img = cur.asset;
          const nw = img.naturalWidth || img.width || 1;
          const nh = img.naturalHeight || img.height || 1;
          const imgAspect = nw / nh;

          const pad = 24;
          const availW = stageW - pad * 2;
          const availH = stageH - pad * 2;
          const availAspect = availW / availH;

          let drawW, drawH, drawX, drawY;
          if (imgAspect > availAspect) {
            drawW = availW;
            drawH = availW / imgAspect;
            drawX = stageX + pad;
            drawY = stageY + pad + (availH - drawH) / 2;
          } else {
            drawH = availH;
            drawW = availH * imgAspect;
            drawX = stageX + pad + (availW - drawW) / 2;
            drawY = stageY + pad;
          }

          ctx.save();
          ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
          ctx.shadowBlur = 40;
          ctx.shadowOffsetY = 16;
          ctx.drawImage(img, drawX, drawY, drawW, drawH);
          ctx.restore();

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(drawX, drawY, drawW, drawH);

          if (cur.face) {
            const bx = drawX + drawW * 0.277;
            const by = drawY + drawH * 0.287;
            const bw = drawW * 0.453;
            const bh = drawH * 0.453;

            ctx.save();
            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 3.5;
            ctx.shadowColor = 'rgba(16, 185, 129, 0.9)';
            ctx.shadowBlur = 20;
            drawRoundedRect(bx, by, bw, bh, 10);
            ctx.stroke();

            ctx.fillStyle = '#10b981';
            drawRoundedRect(bx, by - 32, 230, 28, 6);
            ctx.fill();
            ctx.fillStyle = '#064e3b';
            ctx.font = '800 14px -apple-system, sans-serif';
            ctx.fillText('🎯 Apple Vision 人臉辨識 99.8%', bx + 10, by - 13);
            ctx.restore();
          }
        } else if (cur.type === 'audio') {
          ctx.fillStyle = '#0a0f1d';
          ctx.fillRect(stageX, stageY, stageW, stageH);
          ctx.fillStyle = '#60a5fa';
          ctx.font = '800 24px sans-serif';
          ctx.fillText('🎵 音頻波形即時播放器 (audio_ambient_sample.wav)', stageX + 60, stageY + 80);
          for (let b = 0; b < 55; b++) {
            const bh = Math.abs(Math.sin(st * 14 + b * 0.25)) * 240 + 20;
            ctx.fillStyle = `hsl(${200 + b * 2}, 95%, 65%)`;
            drawRoundedRect(stageX + 60 + b * 20, stageY + (stageH - bh) / 2, 14, bh, 6);
            ctx.fill();
          }
        } else if (cur.type === 'pptx') {
          // PPTX Stage: Left slide thumbnails strip + Center main slide
          ctx.fillStyle = '#0c111e';
          ctx.fillRect(stageX, stageY, stageW, stageH);

          // Left thumbnail strip
          const stripW = 160;
          ctx.fillStyle = '#111726';
          ctx.fillRect(stageX, stageY, stripW, stageH);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
          ctx.beginPath(); ctx.moveTo(stageX + stripW, stageY); ctx.lineTo(stageX + stripW, stageY + stageH); ctx.stroke();

          // 4 miniature slides in strip
          for (let s = 0; s < 4; s++) {
            const thumbY = stageY + 20 + s * 95;
            const isCur = (s === 0);
            ctx.fillStyle = isCur ? 'rgba(245, 158, 11, 0.15)' : '#1e293b';
            ctx.strokeStyle = isCur ? '#f59e0b' : 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = isCur ? 2 : 1;
            drawRoundedRect(stageX + 16, thumbY, 128, 72, 6);
            ctx.fill(); ctx.stroke();

            ctx.fillStyle = isCur ? '#f59e0b' : '#64748b';
            ctx.font = '700 11px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`${s + 1}`, stageX + 24, thumbY + 22);

            // Miniature skeleton lines
            ctx.fillStyle = isCur ? 'rgba(255,255,255,0.7)' : 'rgba(255,255,255,0.2)';
            ctx.fillRect(stageX + 42, thumbY + 16, 60, 6);
            ctx.fillRect(stageX + 24, thumbY + 34, 110, 4);
            ctx.fillRect(stageX + 24, thumbY + 44, 90, 4);
            ctx.fillRect(stageX + 24, thumbY + 54, 70, 4);
          }

          // Main 16:9 Slide Canvas
          const slideW = 940;
          const slideH = 530;
          const slideX = stageX + stripW + (stageW - stripW - slideW) / 2;
          const slideY = stageY + (stageH - slideH) / 2;

          ctx.save();
          ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
          ctx.shadowBlur = 40;
          ctx.shadowOffsetY = 18;

          const slideGrad = ctx.createLinearGradient(slideX, slideY, slideX + slideW, slideY + slideH);
          slideGrad.addColorStop(0, '#0f172a');
          slideGrad.addColorStop(1, '#1e1b4b');
          ctx.fillStyle = slideGrad;
          drawRoundedRect(slideX, slideY, slideW, slideH, 12);
          ctx.fill();
          ctx.restore();

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
          ctx.lineWidth = 1.5;
          drawRoundedRect(slideX, slideY, slideW, slideH, 12);
          ctx.stroke();

          // Top Accent Pill on Slide
          ctx.fillStyle = 'rgba(245, 158, 11, 0.18)';
          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 1.5;
          drawRoundedRect(slideX + 45, slideY + 40, 240, 28, 8);
          ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#fde68a';
          ctx.font = '800 13px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('⚡ 產品戰略與架構 · Q4 2026', slideX + 165, slideY + 59);

          // Slide Title
          ctx.textAlign = 'left';
          ctx.font = '900 36px -apple-system, sans-serif';
          const sTitleGrad = ctx.createLinearGradient(slideX + 45, 0, slideX + 450, 0);
          sTitleGrad.addColorStop(0, '#ffffff');
          sTitleGrad.addColorStop(1, '#fde68a');
          ctx.fillStyle = sTitleGrad;
          ctx.fillText('PowerUp 全能檔案檢視引擎', slideX + 45, slideY + 115);

          ctx.font = '600 16px -apple-system, sans-serif';
          ctx.fillStyle = '#94a3b8';
          ctx.fillText('跨平台高效能本機架構 · 0 秒秒開百種檔案格式', slideX + 45, slideY + 148);

          // 3 Column Cards inside Slide
          const cardCols = [
            { icon: '⚡', title: '毫秒冷啟動', desc: '原生 C++ / MPS 加速，萬行數據瞬開', color: '#f59e0b' },
            { icon: '🤖', title: '原生離線 AI', desc: 'Apple Vision 人臉特徵與 OCR 辨識', color: '#10b981' },
            { icon: '🌐', title: '跨平台生態', desc: 'macOS ＆ Windows 雙版本資料同步', color: '#3b82f6' }
          ];

          cardCols.forEach((cc, ci) => {
            const ccX = slideX + 45 + ci * 290;
            const ccY = slideY + 185;
            const ccW = 265;
            const ccH = 235;

            ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            drawRoundedRect(ccX, ccY, ccW, ccH, 10);
            ctx.fill(); ctx.stroke();

            ctx.fillStyle = cc.color;
            ctx.fillRect(ccX + 22, ccY + 22, 4, 28);

            ctx.fillStyle = '#ffffff';
            ctx.font = '800 19px -apple-system, sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`${cc.icon} ${cc.title}`, ccX + 35, ccY + 44);

            ctx.fillStyle = '#94a3b8';
            ctx.font = '500 13px -apple-system, sans-serif';
            ctx.fillText(cc.desc.split('，')[0], ccX + 22, ccY + 92);
            ctx.fillText(cc.desc.split('，')[1] || '', ccX + 22, ccY + 120);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
            drawRoundedRect(ccX + 22, ccY + 175, ccW - 44, 8, 4);
            ctx.fill();
            ctx.fillStyle = cc.color;
            drawRoundedRect(ccX + 22, ccY + 175, (ccW - 44) * (0.75 + ci * 0.1), 8, 4);
            ctx.fill();
          });

          // Slide Footer
          ctx.fillStyle = '#64748b';
          ctx.font = '600 12px monospace';
          ctx.textAlign = 'left';
          ctx.fillText('PowerUp Productivity Suite · Slide 1 of 18 (Confidential)', slideX + 45, slideY + 495);

          ctx.textAlign = 'right';
          ctx.fillText('免安裝 Microsoft Office 直接檢視大綱', slideX + slideW - 45, slideY + 495);
        } else if (cur.type === 'drawio') {
          // Flowchart Diagram Stage (Clean, well-spaced, no collision!)
          ctx.fillStyle = '#090e1a';
          ctx.fillRect(stageX, stageY, stageW, stageH);

          // Grid pattern
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
          ctx.lineWidth = 1;
          for (let gx = stageX; gx < stageX + stageW; gx += 32) {
            ctx.beginPath(); ctx.moveTo(gx, stageY); ctx.lineTo(gx, stageY + stageH); ctx.stroke();
          }
          for (let gy = stageY; gy < stageY + stageH; gy += 32) {
            ctx.beginPath(); ctx.moveTo(stageX, gy); ctx.lineTo(stageX + stageW, gy); ctx.stroke();
          }

          // Header
          ctx.fillStyle = '#38bdf8';
          ctx.font = '800 22px sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText('📐 向量模組架構拓撲圖 (app_architecture.drawio) · 向量無損縮放', stageX + 45, stageY + 50);

          // Node 1: Local Files
          const n1X = stageX + 50, n1Y = stageY + 240, n1W = 210, n1H = 150;
          const n2X = stageX + 340, n2Y = stageY + 220, n2W = 270, n2H = 190;
          
          ctx.fillStyle = '#1e293b';
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2;
          drawRoundedRect(n1X, n1Y, n1W, n1H, 12);
          ctx.fill(); ctx.stroke();

          ctx.fillStyle = '#fff';
          ctx.font = '800 18px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('📂 本機檔案庫', n1X + n1W / 2, n1Y + 55);
          ctx.font = '500 13px sans-serif';
          ctx.fillStyle = '#94a3b8';
          ctx.fillText('混合格式資料夾', n1X + n1W / 2, n1Y + 85);
          ctx.fillText('4K圖 / JSON / CSV', n1X + n1W / 2, n1Y + 110);

          // Arrow 1 -> 2
          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(n1X + n1W, n1Y + n1H / 2);
          ctx.lineTo(n2X, n2Y + n2H / 2);
          ctx.stroke();

          ctx.fillStyle = '#f59e0b';
          ctx.beginPath();
          ctx.moveTo(n2X, n2Y + n2H / 2);
          ctx.lineTo(n2X - 12, n2Y + n2H / 2 - 8);
          ctx.lineTo(n2X - 12, n2Y + n2H / 2 + 8);
          ctx.fill();

          // Node 2: Core Parser Hub
          ctx.fillStyle = '#1e1b4b';
          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 2.5;
          ctx.shadowColor = 'rgba(245, 158, 11, 0.4)';
          ctx.shadowBlur = 25;
          drawRoundedRect(n2X, n2Y, n2W, n2H, 14);
          ctx.fill(); ctx.stroke();
          ctx.shadowBlur = 0;

          ctx.fillStyle = '#fde68a';
          ctx.font = '900 20px sans-serif';
          ctx.fillText('⚡ 萬用解析引擎核心', n2X + n2W / 2, n2Y + 60);
          ctx.font = '600 14px sans-serif';
          ctx.fillStyle = '#cbd5e1';
          ctx.fillText('毫秒級異步非同步讀取', n2X + n2W / 2, n2Y + 95);
          ctx.fillText('0-Lag Memory Cache', n2X + n2W / 2, n2Y + 125);

          // 3 Output Branches
          const bColors = ['#10b981', '#60a5fa', '#ec4899'];
          const bLabels = [
            { t: '🖼️ Vision AI 人臉/去背', s: 'Apple MPS 硬體加速' },
            { t: '📊 百萬行資料 Profiler', s: '即時圖表計算引擎' },
            { t: '🌳 雙欄樹狀 JSON 編輯', s: '語法自動即時修復' }
          ];

          for (let b = 0; b < 3; b++) {
            const bX = stageX + 690;
            const bY = stageY + 120 + b * 145;
            const bW = 290;
            const bH = 110;

            ctx.strokeStyle = bColors[b];
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(n2X + n2W, n2Y + n2H / 2);
            ctx.lineTo(bX - 25, bY + bH / 2);
            ctx.lineTo(bX, bY + bH / 2);
            ctx.stroke();

            ctx.fillStyle = bColors[b];
            ctx.beginPath();
            ctx.moveTo(bX, bY + bH / 2);
            ctx.lineTo(bX - 10, bY + bH / 2 - 6);
            ctx.lineTo(bX - 10, bY + bH / 2 + 6);
            ctx.fill();

            ctx.fillStyle = '#1e293b';
            ctx.strokeStyle = bColors[b];
            ctx.lineWidth = 2;
            drawRoundedRect(bX, bY, bW, bH, 10);
            ctx.fill(); ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = '800 16px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(bLabels[b].t, bX + 22, bY + 45);

            ctx.fillStyle = '#94a3b8';
            ctx.font = '500 13px sans-serif';
            ctx.fillText(bLabels[b].s, bX + 22, bY + 78);
          }
        }

        ctx.restore();

        // ==========================================
        // 3. Bottom Kinetic Action HUD
        // ==========================================
        ctx.save();
        const pW = 1180; const pH = 68;
        const pX = (W - pW) / 2; const pY = 895;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 2;
        ctx.shadowColor = 'rgba(245, 158, 11, 0.4)';
        ctx.shadowBlur = 24;
        drawRoundedRect(pX, pY, pW, pH, 16);
        ctx.fill(); ctx.stroke();

        ctx.textAlign = 'center';
        ctx.font = '900 20px -apple-system, sans-serif';
        ctx.fillStyle = '#fde68a';
        ctx.fillText('⚡ 按方向鍵 [ ▶ ] 或滾輪連滾 · 0秒極速連切', W / 2 - 240, pY + 41);

        ctx.font = '700 16px -apple-system, sans-serif';
        ctx.fillStyle = '#38bdf8';
        ctx.fillText('免開多個肥重軟體 • 圖片 ➔ JSON ➔ 表格 ➔ Markdown', W / 2 + 200, pY + 41);
        ctx.restore();
      }

      // ==========================================
      // ACT 3: OUTRO & CALL TO ACTION (11.5s - 16.0s)
      // "所有檔案，一個工具搞定。立即前往官網免費下載體驗！"
      // ==========================================
      else {
        // Pure dark clean outro - NO heroBanner background!
        ctx.save();
        ctx.textAlign = 'center';

        // Draw 3D App Icon in center top
        if (assets.appIcon) {
          const iconSize = 160;
          ctx.save();
          ctx.shadowColor = 'rgba(245, 158, 11, 0.5)';
          ctx.shadowBlur = 40;
          ctx.drawImage(assets.appIcon, W / 2 - iconSize / 2, 180, iconSize, iconSize);
          ctx.restore();
        }

        ctx.font = '900 72px -apple-system, sans-serif';
        const finalGrad = ctx.createLinearGradient(W / 2 - 350, 0, W / 2 + 350, 0);
        finalGrad.addColorStop(0, '#f59e0b');
        finalGrad.addColorStop(0.5, '#ec4899');
        finalGrad.addColorStop(1, '#8b5cf6');
        ctx.fillStyle = finalGrad;
        ctx.fillText('所有檔案，一個工具搞定。', W / 2, 420);

        ctx.font = '800 36px -apple-system, sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('立即體驗 PowerUp Toolbox', W / 2, 490);

        ctx.font = '800 28px "SF Mono", monospace';
        ctx.fillStyle = '#60a5fa';
        ctx.fillText('powerup.dancingarden.com', W / 2, 545);

        const btnY = 620;
        const bGrad = ctx.createLinearGradient(W / 2 - 200, 0, W / 2 + 200, 0);
        bGrad.addColorStop(0, '#2563eb');
        bGrad.addColorStop(1, '#1d4ed8');
        ctx.fillStyle = bGrad;
        ctx.shadowColor = 'rgba(37, 99, 235, 0.8)';
        ctx.shadowBlur = 35;
        drawRoundedRect(W / 2 - 220, btnY, 440, 72, 18);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 24px -apple-system, sans-serif';
        ctx.fillText('⚡ 立即前往官網免費下載 ➔', W / 2, btnY + 46);

        ctx.font = '600 17px sans-serif';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('支援 macOS (Apple Silicon & Intel) 及 Windows 雙平台 · 100% 離線本地運算', W / 2, 735);

        ctx.restore();
      }
    }

    window.seekFrame = function(frameIndex) {
      renderFrame(frameIndex);
      return true;
    };
  </script>
</body>
</html>
