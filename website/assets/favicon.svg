<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181f38"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="35%" stop-color="#ec4899"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Squircle rounded background -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
  <!-- Inner border glow -->
  <rect x="36" y="36" width="440" height="440" rx="108" fill="none" stroke="rgba(236,72,153,0.2)" stroke-width="2"/>
  <!-- Lightning Bolt -->
  <polygon points="290,80 160,260 260,260 220,432 370,230 270,230" 
           fill="url(#boltGrad)" 
           filter="url(#glow)" />
</svg>