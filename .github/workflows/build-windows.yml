name: Build and Release Windows Portable

on:
  push:
    tags:
      - 'win-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. win-v2.8.15)'
        required: true
        default: 'win-v2.8.15'
      notes:
        description: 'Release Notes'
        required: false
        default: 'PowerUp Toolbox for Windows v2.8.15'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build Windows Portable Zip
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File windows/build_windows.ps1

      - name: Determine Tag & Title
        id: meta
        shell: pwsh
        run: |
          $ver = (Get-Content "windows/VERSION" -Raw).Trim()
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          if (-not $tag) { $tag = "win-v$ver" }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $ver = "${{ steps.meta.outputs.version }}"
          $zip = "release_win/PowerUpToolbox-portable.zip"
          $title = "PowerUp Toolbox for Windows v$ver"
          $notes = if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ github.event.inputs.notes }}") {
            "${{ github.event.inputs.notes }}"
          } else {
            "- 文件內關鍵字即時搜尋：全面支援 Excel、CSV、Word、PDF、Markdown 按 Ctrl+F 即時搜尋字串、高亮標註、跳轉符合項目與計數`n- 零相依 Office 檔案極速解析：內建純 Python 標準庫解析引擎，無須額外套件即可完美開啟 .xlsx / .docx / .pptx`n- 修正前端重複宣告變數問題，確保啟動與開啟檔案順暢無阻`n- 支援文件與程式碼視圖雙指/滾輪縮放"
          }
          
          $exists = gh release view $tag --repo ${{ github.repository }} 2>$null
          if ($exists) {
            Write-Host "Updating existing release $tag..."
            gh release upload $tag $zip --repo ${{ github.repository }} --clobber
          } else {
            Write-Host "Creating new release $tag..."
            gh release create $tag $zip --repo ${{ github.repository }} --title $title --notes $notes
          }
